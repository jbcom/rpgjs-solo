name: Fork CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ inputs.commit || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character v5 tracking commit to validate
        required: true
        type: string

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Prove requested tracking commit
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Requested commit must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$REQUESTED_COMMIT"
          git fetch --no-tags origin \
            +refs/heads/v5:refs/remotes/origin/v5
          git fetch --no-tags https://github.com/RSamaium/RPG-JS.git \
            +refs/heads/v5:refs/remotes/upstream/v5
          test "$(git rev-parse refs/remotes/origin/v5)" = "$REQUESTED_COMMIT"
          test "$(git rev-parse refs/remotes/upstream/v5)" = "$REQUESTED_COMMIT"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Dependency currency
        if: github.event_name != 'workflow_dispatch'
        run: pnpm verify:toolchain-currency

      - name: Workspace dependency audit
        run: pnpm audit --audit-level=low

      - name: Build
        run: pnpm build

      - name: Package archive boundaries
        if: github.event_name != 'workflow_dispatch'
        run: pnpm verify:package-archive-boundaries

      - name: Public API boundary
        run: pnpm api:boundary

      - name: Public API type contracts
        run: pnpm test:types

      - name: Solo production boundary
        if: github.event_name != 'workflow_dispatch'
        run: pnpm verify:solo-boundary

      - name: Solo packed package contracts
        if: github.event_name != 'workflow_dispatch'
        run: pnpm verify:solo-package-contracts

      - name: Solo packed consumer execution
        if: github.event_name != 'workflow_dispatch'
        run: pnpm verify:solo-consumer

      - name: Published package dependency contracts
        if: github.event_name != 'workflow_dispatch'
        run: pnpm verify:published-package-contracts

      - name: Unit tests
        run: pnpm test --run

      - name: Cloudflare MMORPG runtime tests
        run: pnpm --dir samples/cloudflare-mmorpg test

      - name: Cloudflare Studio runtime tests
        run: pnpm --dir playground/games/studio test

      - name: Playground and sample builds
        run: pnpm --filter '@rpgjs/playground-*' --filter sample run build
