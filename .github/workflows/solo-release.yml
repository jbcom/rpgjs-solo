name: Solo release

on:
  workflow_dispatch:
    inputs:
      command:
        description: Planned Solo release command
        required: true
        type: choice
        default: validate
        options: [validate, pack, publish, verify-candidate, promote, publish-releases]
      artifact_run_id:
        description: GitHub Actions run ID that uploaded the reviewed Solo pack artifact
        required: false
        type: string
      execute:
        description: Permit a guarded mutation after every release binding is final
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    if: inputs.command != 'publish-releases'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0 && test "$(npm --version)" = 11.21.0
      - name: Reject token-based publication
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${RPGJS_SOLO_NPM_TOKEN:-}"
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Validate reviewed Solo release bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:solo:validate
      - name: Stop unapproved execution
        if: inputs.execute != true
        run: |
          test "${{ inputs.command }}" = validate
          echo "Validated only; mutation requires reviewed final bindings and explicit execution."
      - name: Require a packed artifact run
        if: inputs.execute == true && inputs.command != 'validate' && inputs.command != 'pack'
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          test -n "$ARTIFACT_RUN_ID"
          case "$ARTIFACT_RUN_ID" in
            *[!0-9]* | 0) exit 1 ;;
          esac
      - name: Restore the hash-bound pack artifact
        if: inputs.execute == true && inputs.command != 'validate' && inputs.command != 'pack'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: solo-release-artifacts
          path: ${{ runner.temp }}/solo-release-artifacts
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Resolve the restored provenance manifest
        id: provenance
        if: inputs.execute == true && inputs.command != 'validate' && inputs.command != 'pack'
        run: |
          mapfile -t manifests < <(find "$RUNNER_TEMP/solo-release-artifacts" -type f -name '*.provenance.json' -print)
          test "${#manifests[@]}" -eq 1
          manifest="$(realpath "${manifests[0]}")"
          test "${manifest#"$RUNNER_TEMP/solo-release-artifacts/"}" != "$manifest"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - name: Pack the reviewed Solo cohort
        if: inputs.execute == true && inputs.command == 'pack'
        env:
          GH_TOKEN: ${{ github.token }}
          RPGJS_SOLO_RELEASE_CONFIRM: 5.0.0-beta.29.solo.3
        run: pnpm release:solo:pack -- --artifacts "$RUNNER_TEMP/solo-release-artifacts"
      - name: Persist the hash-bound pack artifact
        if: inputs.execute == true && inputs.command == 'pack'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solo-release-artifacts
          path: ${{ runner.temp }}/solo-release-artifacts
          if-no-files-found: error
          retention-days: 90
      - name: Execute reviewed OIDC release action
        if: inputs.execute == true && inputs.command != 'validate' && inputs.command != 'pack'
        env:
          GH_TOKEN: ${{ github.token }}
          RPGJS_SOLO_RELEASE_CONFIRM: 5.0.0-beta.29.solo.3
        run: |
          command="${{ inputs.command }}"
          case "$command" in
            publish|verify-candidate|promote)
              pnpm "release:solo:$command" -- --manifest "${{ steps.provenance.outputs.manifest }}" --execute ;;
            *) exit 1 ;;
          esac

  reconcile-source-release:
    if: inputs.execute == true && inputs.command == 'publish-releases'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Require the reviewed pack artifact run
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          test -n "$ARTIFACT_RUN_ID"
          case "$ARTIFACT_RUN_ID" in
            *[!0-9]* | 0) exit 1 ;;
          esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: solo-release-artifacts
          path: ${{ runner.temp }}/solo-release-artifacts
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Resolve the restored provenance manifest
        id: provenance
        run: |
          mapfile -t manifests < <(find "$RUNNER_TEMP/solo-release-artifacts" -type f -name '*.provenance.json' -print)
          test "${#manifests[@]}" -eq 1
          manifest="$(realpath "${manifests[0]}")"
          test "${manifest#"$RUNNER_TEMP/solo-release-artifacts/"}" != "$manifest"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Validate reviewed Solo release bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:solo:validate
      - name: Reconcile the reviewed source release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RPGJS_SOLO_RELEASE_CONFIRM: 5.0.0-beta.29.solo.3
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          # shellcheck disable=SC2016 # expand this token only when Git requests credentials
          git config --local credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          trap 'git config --local --unset-all credential.helper || true; git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          pnpm release:solo:publish-releases -- --manifest "${{ steps.provenance.outputs.manifest }}" --execute
