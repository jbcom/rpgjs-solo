name: Solo release

on:
  workflow_dispatch:
    inputs:
      command:
        description: Planned Solo release command
        required: true
        type: choice
        default: validate
        options: [validate, pack, publish, verify-candidate, promote, publish-releases]
      artifacts:
        description: Absolute artifacts directory for pack, or manifest path for later commands
        required: false
        type: string
      execute:
        description: Permit a guarded mutation after every release binding is final
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0 && test "$(npm --version)" = 11.21.0
      - name: Reject token-based publication
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${RPGJS_SOLO_NPM_TOKEN:-}"
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm release:solo:validate
      - name: Stop unapproved execution
        if: inputs.execute != true
        run: |
          test "${{ inputs.command }}" = validate
          echo "Validated only; mutation requires reviewed final bindings and explicit execution."
      - name: Execute reviewed release action
        if: inputs.execute == true
        env:
          RPGJS_SOLO_RELEASE_CONFIRM: 5.0.0-beta.29.solo.3
        run: |
          command="${{ inputs.command }}"
          artifacts="${{ inputs.artifacts }}"
          case "$command" in
            validate) pnpm release:solo:validate ;;
            pack) test -n "$artifacts" && pnpm release:solo:pack -- --artifacts "$artifacts" ;;
            publish|verify-candidate|promote|publish-releases)
              test -n "$artifacts" && pnpm "release:solo:$command" -- --manifest "$artifacts" --execute ;;
            *) exit 1 ;;
          esac
